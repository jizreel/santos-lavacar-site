name: Deploy GitHub Pages

# Pages está em modo legacy (branch main, /). O GitHub dispara
# automaticamente o workflow pages-build-deployment a cada push.
# Este workflow só regenera e valida o artefato estático, sem competir
# com o deploy nativo. Para migrar para build_type=workflow, reative o
# job deploy com actions/deploy-pages e altere Settings → Pages.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-validate
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate site
        run: node scripts/configurar.mjs

      - name: Confirm Pages entrypoints
        run: |
          test -f index.html
          test -f .nojekyll
          test -f 404.html
          test -f assets/logo.png
          grep -q 'jizreel.github.io/santos-lavacar-site' index.html
